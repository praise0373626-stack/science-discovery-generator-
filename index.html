<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Science Discovery Generator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <h1>Science Discovery Generator</h1>
    <p>Explore a surprising idea from science.</p>

    <button id="generateBtn">Generate a discovery</button>

    <section class="card">
      <p class="label">Topic</p>
      <h2 id="topicName">Ready to explore?</h2>

      <p class="label">Fact</p>
      <p id="factText">Press the button to discover something new.</p>

      <p class="label">Why it matters</p>
      <p id="importanceText"></p>

      <p class="label">Experiment idea</p>
      <p id="experimentText"></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
